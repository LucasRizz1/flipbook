<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#e9e9e9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>DheyTécnica</title>
  <!-- prévia ao compartilhar o link (WhatsApp, redes sociais); preenchida por
       tools/pdf2book.py --site-url https://usuario.github.io/flipbook/ -->
  <!-- social:start -->
  <meta name="description" content="Complete lines for rendering and water &amp; effluent treatment">
  <meta property="og:type" content="website">
  <meta property="og:title" content="DheyTécnica">
  <meta property="og:description" content="Complete lines for rendering and water &amp; effluent treatment">
  <meta property="og:url" content="https://lucasrizz1.github.io/flipbook/">
  <meta property="og:image" content="https://lucasrizz1.github.io/flipbook/book/cover.jpg?v=20261113132231">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <!-- social:end -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f5fd0'/%3E%3Cpath d='M8 9h7v14H8zM17 9h7v14h-7z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/flipbook.css">
</head>
<body>
  <!--
    Os textos da interface (dicas e rótulos) vêm de js/i18n.js:
    data-i18n="chave" preenche title + aria-label; data-i18n-text preenche o texto.
  -->
  <div class="fb-app is-loading" id="app">

    <!-- área do livro (o motor monta o conteúdo aqui dentro) -->
    <main class="fb-stage" id="stage" aria-label="Flipbook"></main>

    <button class="fb-arrow fb-arrow-prev" id="btnPrev" data-i18n="prev">
      <svg viewBox="0 0 24 48" aria-hidden="true"><path d="M17 4 6 24l11 20"/></svg>
    </button>
    <button class="fb-arrow fb-arrow-next" id="btnNext" data-i18n="next">
      <svg viewBox="0 0 24 48" aria-hidden="true"><path d="M7 4l11 20L7 44"/></svg>
    </button>

    <header class="fb-bar fb-top">
      <h1 class="fb-title" id="title"></h1>

      <nav class="fb-tools" id="tools" data-i18n="tools">
        <button data-act="thumbs" data-i18n="thumbs">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1"/><rect x="13.5" y="3.5" width="7" height="7" rx="1"/><rect x="3.5" y="13.5" width="7" height="7" rx="1"/><rect x="13.5" y="13.5" width="7" height="7" rx="1"/></svg>
        </button>
        <button data-act="share" data-i18n="share">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="2.6"/><circle cx="17.5" cy="5.5" r="2.6"/><circle cx="17.5" cy="18.5" r="2.6"/><path d="m8.3 10.7 6.9-3.9M8.3 13.3l6.9 3.9"/></svg>
        </button>
        <a data-act="download" id="btnDownload" data-i18n="download" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5v11.5m0 0-4.5-4.5M12 15l4.5-4.5M4 16.5v2.5a1.5 1.5 0 0 0 1.5 1.5h13a1.5 1.5 0 0 0 1.5-1.5v-2.5"/></svg>
        </a>
        <button data-act="sound" id="btnSound" data-i18n="sound">
          <svg class="ico-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4Z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.8 7.8 0 0 1 0 11"/></svg>
          <svg class="ico-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4Z"/><path d="m16 9.5 5 5m0-5-5 5"/></svg>
        </button>
        <button data-act="zoom" class="only-desktop" data-i18n="zoom">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5M10.5 7.8v5.4M7.8 10.5h5.4"/></svg>
        </button>
      </nav>

      <nav class="fb-zoombar" id="zoombar" data-i18n="zoom" hidden>
        <button data-act="zoom-out" data-i18n="zoomOut">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5M7.8 10.5h5.4"/></svg>
        </button>
        <input type="range" id="zoomRange" min="1" max="4" step="0.01" value="1" data-i18n="zoomLevel">
        <button data-act="zoom-in" data-i18n="zoomIn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5M10.5 7.8v5.4M7.8 10.5h5.4"/></svg>
        </button>
        <button data-act="zoom-reset" data-i18n="zoomClose">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="m9 9 6 6m0-6-6 6"/></svg>
        </button>
      </nav>

      <div class="fb-brand" id="brand"></div>
    </header>

    <footer class="fb-bar fb-bottom">
      <div class="fb-pagenum" aria-live="polite"><b id="pageLabel">1</b><span> / </span><span id="pageTotal">–</span></div>
      <div class="fb-slider">
        <input type="range" id="pageRange" min="0" max="1" step="1" value="0" data-i18n="slider">
        <div class="fb-tip" id="tip" hidden><div class="fb-tip-imgs" id="tipImgs"></div><span id="tipLabel"></span></div>
      </div>
      <button data-act="fullscreen" id="btnFull" data-i18n="fullscreen">
        <svg class="ico-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
        <svg class="ico-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg>
      </button>
    </footer>

    <div class="fb-scrim" id="scrim" hidden></div>
    <aside class="fb-panel" id="panel" data-i18n="thumbs" aria-hidden="true">
      <header>
        <span data-i18n-text="thumbs"></span>
        <button data-act="panel-close" data-i18n="close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </header>
      <div class="fb-thumbs" id="thumbs"></div>
    </aside>

    <div class="fb-toast" id="toast" role="status"></div>

    <div class="fb-loader" id="loader">
      <div class="fb-loader-book" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="fb-loader-title" id="loaderTitle"></div>
      <div class="fb-loader-msg" id="loaderMsg" data-i18n-text="loading"></div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
